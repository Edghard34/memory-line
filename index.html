<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Jelly — Street Lab</title><style>*{box-sizing:border-box;touch-action:none}body{margin:0;background:#161719;color:white;font:14px system-ui;overflow:hidden}canvas{width:100vw;height:100dvh;display:block;image-rendering:pixelated}#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;pointer-events:none;text-shadow:0 2px 4px black}#controls{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:16px;right:16px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}button{pointer-events:auto;background:#20252bd9;color:white;border:1px solid #ffffff55;border-radius:12px;min-width:54px;height:54px;font:bold 22px system-ui;user-select:none}#pad{display:grid;grid-template-columns:repeat(3,54px);gap:3px}#pad button:first-child{grid-column:2}#pad button:nth-child(2){grid-column:1}#load{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#15191e;padding:24px}#load[hidden]{display:none}input{touch-action:auto}small{opacity:.75}</style><canvas id="c"></canvas><div id="hud">JELLY / STREET LAB 0.2<br><small id="status">Rua viva • 0.2</small></div><div id="controls"><div id="pad"><button data-k="up">↑</button><button data-k="left">←</button><button data-k="down">↓</button><button data-k="right">→</button></div><button data-k="run">CORRER</button></div><div id="load"><h2>Jelly — Street Lab</h2><p>Importe o pacote local de imagens JSON.</p><input id="file" type="file" accept=".json,application/json"></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),status=document.querySelector('#status'),load=document.querySelector('#load');let art=null,p={x:300,y:285,vx:0,vy:0,face:1,dir:'side',phase:0},keys=new Set(),target=null,cam=0,last=0,scale=1,ox=0,oy=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));async function boot(data){const img=src=>new Promise((ok,no)=>{let i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=src});let a={street:await img(data.street)};for(const k of ['walk','front','back','run','idle'])a[k]=await Promise.all(data[k].map(img));a.cars=await Promise.all((data.cars||[]).map(img));a.pedestrians=await Promise.all((data.pedestrians||[]).map(group=>Promise.all(group.map(img))));art=a;load.hidden=true}document.querySelector('#file').onchange=async e=>{try{await boot(JSON.parse(await e.target.files[0].text()))}catch(e){alert('Pacote inválido')}};const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',Shift:'run'};onkeydown=e=>{if(map[e.key]){e.preventDefault();keys.add(map[e.key]);if(map[e.key]!=='run')target=null}};onkeyup=e=>keys.delete(map[e.key]);onblur=()=>{keys.clear();target=null};for(const b of document.querySelectorAll('[data-k]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.k);if(b.dataset.k!=='run')target=null};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.k)}c.onpointerdown=e=>{if(!art)return;let x=(e.clientX-ox)/scale+cam,y=(e.clientY-oy)/scale;target={x:clamp(x,18,865),y:clamp(y,267,307)}};const traffic=Array.from({length:5},(_,i)=>({x:i*223-75,y:i%2?355:337,dir:i%2?1:-1,speed:43+i*5,type:i%3}));const pedestrians=Array.from({length:7},(_,i)=>({x:45+i*132,y:272+(i%3)*13,dir:i%2?1:-1,speed:16+i%4*3,phase:i*2}));function sceneActor(im,x,y,dir){g.save();g.translate(Math.round(x),Math.round(y));if(dir<0)g.scale(-1,1);g.drawImage(im,-Math.floor(im.width/2),-im.height);g.restore()}function frame(t){requestAnimationFrame(frame);let dt=Math.min(.04,(t-last)/1000||0);last=t;if(!art)return;let w=innerWidth,h=innerHeight,dpr=devicePixelRatio||1;if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}g.setTransform(dpr,0,0,dpr,0,0);g.imageSmoothingEnabled=false;scale=Math.min(h/360,w/300);let vw=w/scale;ox=Math.max(0,(w-883*scale)/2);oy=(h-360*scale)/2;let dx=+keys.has('right')-+keys.has('left'),dy=+keys.has('down')-+keys.has('up');if(target&&!dx&&!dy){dx=target.x-p.x;dy=(target.y-p.y)*1.5;if(Math.hypot(dx,dy)<2){target=null;dx=dy=0}}let n=Math.hypot(dx,dy);if(n){dx/=n;dy/=n}let run=keys.has('run'),speed=run?115:55,f=1-Math.exp(-dt*16);p.vx+=(dx*speed-p.vx)*f;p.vy+=(dy*speed*.55-p.vy)*f;p.x=clamp(p.x+p.vx*dt,18,865);p.y=clamp(p.y+p.vy*dt,267,307);let moving=Math.hypot(p.vx,p.vy)>4;if(n){if(Math.abs(dx)>.55){p.dir='side';p.face=dx>0?1:-1}else p.dir=dy>0?'front':'back'}let mode=moving?(p.dir==='side'?(run?'run':'walk'):p.dir):'idle';p.phase+=dt*(moving?(run?13:9):2);let frames=art[mode],im=frames[Math.floor(p.phase)%frames.length];let want=clamp(p.x-vw/2,0,Math.max(0,883-vw));cam+=(want-cam)*(1-Math.exp(-dt*7));g.fillStyle='#161719';g.fillRect(0,0,w,h);g.save();g.translate(Math.round(ox-cam*scale),Math.round(oy));g.scale(scale,scale);g.drawImage(art.street,0,0);for(const q of traffic){q.x+=q.speed*q.dir*dt;if(q.x>980)q.x=-100;if(q.x< -100)q.x=980;if(art.cars.length)sceneActor(art.cars[q.type%art.cars.length],q.x,q.y,-q.dir)}for(const q of pedestrians){q.x+=q.speed*q.dir*dt;q.phase+=dt*7;if(q.x< -20)q.x=903;if(q.x>903)q.x=-20}const drawPed=q=>{if(!art.pedestrians.length)return;let a=art.pedestrians[0];sceneActor(a[Math.floor(q.phase)%a.length],q.x,q.y+1,q.dir)};const sorted=pedestrians.slice().sort((a,b)=>a.y-b.y);sorted.filter(q=>q.y<=p.y).forEach(drawPed);g.fillStyle='#0005';g.beginPath();g.ellipse(Math.round(p.x),Math.round(p.y),7,2,0,0,Math.PI*2);g.fill();g.save();g.translate(Math.round(p.x),Math.round(p.y));if(p.dir==='side'&&p.face<0)g.scale(-1,1);g.drawImage(im,-Math.floor(im.width/2),-im.height);g.restore();sorted.filter(q=>q.y>p.y).forEach(drawPed);g.restore();status.textContent=(moving?(run?'Correndo':'Caminhando'):'Parado')+' · '+Math.round(p.x)+' mapeado';}requestAnimationFrame(frame);
</script></html>
