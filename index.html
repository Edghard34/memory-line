<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>BRASA</title>
<link rel="stylesheet" href="styles/game.css?v=36">
<style>.npc-dialogue:has(.npc-choices button:nth-child(3)){display:flex;align-items:center;gap:12px;max-width:90vw}.npc-dialogue:has(.npc-choices button:nth-child(3)) .npc-choices{display:flex;flex-direction:column;gap:5px;min-width:180px}</style><style>.sheet.inventory-sheet{width:min(720px,94vw);max-height:92vh;padding:12px;background:#211c17;border:2px solid #9b7950;color:#e9d6b4}.inv-layout{display:grid;grid-template-columns:1fr 1.35fr;gap:12px}.inv-equip{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-items:center}.inv-equip img{width:100%;max-height:80px;object-fit:contain;image-rendering:pixelated}.inv-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.inv-slot{min-width:0;aspect-ratio:1;padding:2px!important;background:#332b23!important;border:1px solid #756044!important;color:#e9d6b4;font-size:11px;position:relative}.inv-slot img{width:65%;height:65%;object-fit:contain;image-rendering:pixelated}.inv-slot.selected{border:2px solid #e6b76b!important}.inv-slot small{position:absolute;bottom:1px;right:3px}.inv-info{min-height:40px;font-size:12px;margin-top:6px}.inv-footer{display:flex;justify-content:space-between;gap:6px}.inv-footer button{padding:6px 12px}</style></head><body><main id="app">
<canvas id="scene" aria-label="Arena de BRASA"></canvas>
<div id="hud" hidden><div><div class="meter" role="meter" aria-label="Chama" aria-valuemin="0" aria-valuemax="100"><div id="flame"></div></div><div id="stats"></div></div><div id="place"></div><button class="pause" id="pause" aria-label="Pausar">Ⅱ</button></div>
<div id="announce" role="status"></div>
<div id="touch" hidden><div id="pad" aria-label="Joystick"><div id="nub"></div></div><div class="actions"><button id="inventory" onclick="openInventory()">Mochila</button><button id="dash">Esquiva</button><button id="skill">Dom</button><button class="main" id="fire">Atacar</button></div></div>
<div id="panel"></div>
<div id="rotate" role="status"><strong>BRASA</strong><span>Gire o celular para jogar na horizontal.</span></div>
<button id="talk" hidden style="position:absolute;left:50%;bottom:18%;transform:translateX(-50%);z-index:8;padding:12px 20px;background:#34251c;color:#ffe4aa;border:1px solid #b58a52;border-radius:8px">Conversar</button><div id="build-version" style="position:fixed;top:5px;right:8px;z-index:99999;color:#fff;background:#181510b8;padding:3px 6px;font:11px monospace;pointer-events:none">v36 · carregando</div><div id="sleep-fade" style="position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:100000"></div></main>
