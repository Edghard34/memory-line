<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Jelly — Street Lab 0.24</title><style>*{box-sizing:border-box;touch-action:none}body{margin:0;background:#161719;color:white;font:14px system-ui;overflow:hidden}canvas{width:100vw;height:100dvh;display:block;image-rendering:pixelated}#hud{display:none!important}#controls{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:16px;right:16px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}button{pointer-events:auto;background:#20252bd9;color:white;border:1px solid #ffffff55;border-radius:12px;min-width:54px;height:54px;font:bold 22px system-ui;user-select:none}#pad{display:grid;grid-template-columns:repeat(3,54px);gap:3px}#pad button:first-child{grid-column:2}#pad button:nth-child(2){grid-column:1}#load{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#15191e;padding:24px}#load[hidden]{display:none}input{touch-action:auto}small{opacity:.75}</style><canvas id="c"></canvas><div id="hud">JELLY / STREET LAB 0.24<br><small id="status">Câmera ampla • 0.24</small></div><div id="load"><h2>Jelly — Street Lab 0.24</h2><p>Importe o novo pacote jelly_brasil.json.</p><input id="file" type="file" accept=".json,application/json"></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),status=document.querySelector('#status'),load=document.querySelector('#load');let art=null,p={x:300,y:284,vx:0,vy:0,face:1,dir:'side',phase:0},keys=new Set(),target=null,cam=0,last=0,scale=1,ox=0,oy=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function makeShadedStreet(img){const b=document.createElement('canvas');b.width=1080;b.height=360;const q=b.getContext('2d');q.imageSmoothingEnabled=false;q.drawImage(img,0,0);/* Restore the wall behind the yellow bin with adjacent original wall pixels. */q.drawImage(img,864,228,8,30,847,228,8,30);q.drawImage(img,864,228,8,30,855,228,8,30);return b;}async function boot(data){const img=src=>new Promise((ok,no)=>{let i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=src});let a={street:await img(data.street)};if(a.street.naturalWidth!==1080||a.street.naturalHeight!==360)throw new Error("Importe jelly_brasil.json");for(const k of ['walk','front','back','run','idle'])a[k]=await Promise.all(data[k].map(img));a.shaded=makeShadedStreet(a.street);art=a;load.hidden=true;if(new URLSearchParams(location.search).has('texture')){const v=document.createElement('div');v.style.cssText='position:fixed;inset:0;background:#fff;z-index:100;overflow:auto;touch-action:pan-x pan-y';const label=document.createElement('p');label.style.cssText='margin:8px;color:#111;font:14px system-ui';label.textContent='TEXTURA ORIGINAL — '+a.street.naturalWidth+' × '+a.street.naturalHeight+' — sem câmera, HUD ou sombras adicionadas';v.append(label);const raw=a.street.cloneNode();raw.style.cssText='display:block;width:100%;height:auto;image-rendering:pixelated';v.append(raw);document.body.append(v);c.hidden=true;}}document.querySelector('#file').onchange=async e=>{try{await boot(JSON.parse(await e.target.files[0].text()))}catch(e){alert('Pacote inválido')}};let cameraReady=false;let lastTap=null;onblur=()=>{lastTap=null};c.onpointerdown=e=>{if(!art||!e.isPrimary||e.button!==0)return;e.preventDefault();const x=clamp((e.clientX-ox)/scale+cam,18,1062),y=clamp((e.clientY-oy)/scale,273,295),now=performance.now();const run=!!lastTap&&now-lastTap.t<=350&&Math.hypot(e.clientX-lastTap.sx,e.clientY-lastTap.sy)<=32;target={x,y:blocked(x,y)?279:y,run};lastTap=run?null:{t:now,sx:e.clientX,sy:e.clientY}};const npc={x:450,y:284,vx:0,vy:0,face:1,dir:'side',phase:0,goal:1042};function moveJelly(p,dx,dy,run,dt){let n=Math.hypot(dx,dy);if(n){dx/=n;dy/=n}let speed=run?115:55,f=1-Math.exp(-dt*16);p.vx+=(dx*speed-p.vx)*f;p.vy+=(dy*speed*.55-p.vy)*f;let nx=clamp(p.x+p.vx*dt,18,1062),ny=clamp(p.y+p.vy*dt,273,295);if(blocked(nx,p.y)){nx=p.x;p.vx=0}if(blocked(nx,ny)){ny=p.y;p.vy=0}p.x=nx;p.y=ny;let moving=Math.hypot(p.vx,p.vy)>4;if(n){if(Math.abs(dx)>.55){p.dir='side';p.face=dx>0?1:-1}else p.dir=dy>0?'front':'back'}let mode=moving?(p.dir==='side'?(run?'run':'walk'):p.dir):'idle';p.phase+=dt*(moving?(run?13:9):2);return art[mode][Math.floor(p.phase)%art[mode].length];}const pole={x:843,y:290,left:834,right:852};function blocked(x,y){return ((x-843)/12)**2+((y-289)/5)**2<1;}function steer(actor,tx,ty){if((actor.x-843)*(tx-843)<0&&Math.abs(actor.x-843)<48&&Math.abs(actor.y-289)<6)return {x:actor.x,y:279};return {x:tx,y:ty};}function drawPole(){g.save();g.beginPath();g.moveTo(837,0);g.lineTo(850,0);g.lineTo(850,290);g.lineTo(835,290);g.closePath();g.clip();g.drawImage(art.shaded,0,0);g.restore();}function drawJelly(p,im){g.fillStyle='#0005';g.beginPath();g.ellipse(Math.round(p.x),Math.round(p.y),7,2,0,0,Math.PI*2);g.fill();g.save();g.translate(Math.round(p.x),Math.round(p.y));if(p.dir==='side'&&p.face<0)g.scale(-1,1);g.drawImage(im,-Math.round(im.width*.95),-Math.round(im.height*1.9),Math.round(im.width*1.9),Math.round(im.height*1.9));g.restore();}function frame(t){requestAnimationFrame(frame);let dt=Math.min(.04,(t-last)/1000||0);last=t;if(!art)return;let w=innerWidth,h=innerHeight,dpr=devicePixelRatio||1;if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}g.setTransform(dpr,0,0,dpr,0,0);g.imageSmoothingEnabled=false;scale=Math.min(h/360,w/720);let vw=w/scale;if(vw>800){scale=w/800;vw=800}ox=0;oy=Math.min(0,(h-360*scale)/2);let dx=0,dy=0,run=false;if(target){const waypoint=steer(p,target.x,target.y);dx=waypoint.x-p.x;dy=(waypoint.y-p.y)/.55;run=target.run;const dist=Math.hypot(dx,dy);if(waypoint.x===target.x&&waypoint.y===target.y&&dist<=Math.max(2,(run?115:55)*dt+1)){if(!blocked(target.x,target.y)){p.x=target.x;p.y=target.y;}p.vx=0;p.vy=0;target=null;dx=dy=0;run=false}}let im=moveJelly(p,dx,dy,run,dt),moving=Math.hypot(p.vx,p.vy)>4;let want=clamp(p.x-vw*.5,0,Math.max(0,1080-vw));if(!cameraReady){cam=want;cameraReady=true}else{cam=clamp(cam+(want-cam)*(1-Math.exp(-dt*14)),0,Math.max(0,1080-vw));}g.fillStyle='#161719';g.fillRect(0,0,w,h);g.save();g.translate(ox-cam*scale,oy);g.scale(scale,scale);g.drawImage(art.shaded,0,0);const extra=h/scale-360;if(extra>0){const ih=art.shaded.height,iw=art.shaded.width;g.drawImage(art.shaded,0,ih-1,iw,1,0,360,1080,extra+1);}if(Math.abs(npc.goal-npc.x)<2)npc.goal=npc.goal===1042?38:1042;const npcIm=moveJelly(npc,npc.goal-npc.x,0,false,dt);g.save();for(const o of [{y:p.y,draw:()=>drawJelly(p,im)},{y:npc.y,draw:()=>drawJelly(npc,npcIm)},{y:pole.y,draw:drawPole}].sort((a,b)=>a.y-b.y))o.draw();g.restore();g.restore();/* Diagnostic: no global lighting overlay. */status.textContent=(moving?(run?'Correndo':'Caminhando'):'Parado')+' · '+Math.round(p.x)+' mapeado';}requestAnimationFrame(frame);
