<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BRASA</title>
<style>
:root{color-scheme:dark;--paper:#fbe6b5;--gold:#ffbf66;--muted:#bdaf9d;--line:#5b4434}
*{box-sizing:border-box}body{margin:0;background:#100e13;color:var(--paper);font-family:system-ui,sans-serif;overscroll-behavior:none}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:2px solid var(--gold)}button:disabled{opacity:.42;cursor:default}
#app{height:100dvh;position:relative;display:grid;place-items:center;overflow:hidden;background:#110e12}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#hud{position:absolute;z-index:2;inset:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) auto max(12px,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
#hud[hidden],#touch[hidden],#panel[hidden]{display:none}.meter{width:min(46vw,260px);height:12px;border:1px solid #b47f4e;background:#241818;box-shadow:0 0 0 3px #150e14;border-radius:2px;overflow:hidden}#flame{height:100%;background:linear-gradient(90deg,#bd4734,#ff9b43 75%,#ffe899);transition:width .13s}#stats,#place{font-size:12px;font-weight:750;text-shadow:1px 2px #170f14}#place{text-align:right}.pause{pointer-events:auto;padding:6px 12px;background:#211821;border:1px solid var(--line);border-radius:5px}
#announce{position:absolute;top:19%;left:50%;transform:translateX(-50%);color:#fff0c9;font:700 clamp(14px,3vw,25px) Georgia;letter-spacing:.035em;text-shadow:0 2px 5px #100810;text-align:center;pointer-events:none;white-space:nowrap;z-index:2}
#panel{position:absolute;inset:0;z-index:5;display:grid;align-items:safe center;justify-items:center;overflow:auto;padding:max(15px,env(safe-area-inset-top)) 14px max(15px,env(safe-area-inset-bottom));background:#110b16bd;backdrop-filter:blur(2px)}
.sheet{width:min(100%,760px);padding:clamp(15px,3.5vw,36px);border:1px solid #806040;border-radius:9px;background:radial-gradient(ellipse at 50% 0,#392520,#211923 60%,#17131c);box-shadow:0 14px 70px #0009,inset 0 0 0 4px #140f1855;text-align:center}
h1,h2,p{margin:0}h1{font:900 clamp(55px,17vw,118px)/.85 Georgia,serif;letter-spacing:.08em;color:#ffd480;text-shadow:0 3px #b96336,0 8px 34px #f96d3a61;padding-left:.08em}h2{font:700 clamp(24px,5vw,42px) Georgia}.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:0 0 12px}.subtitle{margin:12px auto 19px;color:#dcc4a7;max-width:50ch;line-height:1.5}.menu,.grid{display:grid;gap:9px;margin:12px 0}.menu{max-width:300px;margin-inline:auto}.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,175px),1fr))}
.menu button,.card,.back{border:1px solid #76543e;background:#30232b;border-radius:5px;padding:10px}.menu button:first-child{background:#ebac60;color:#291617;font-weight:800;border-color:#ffd895}.card{text-align:left;min-height:65px}.card img{width:26px;height:26px;object-fit:contain;image-rendering:pixelated;float:right;margin-left:8px}.card.hero img{width:54px;height:54px}.card strong,.card small{display:block}.card strong{color:var(--paper)}.card small{color:#d1bfae;line-height:1.35;margin-top:4px}.card:hover,.back:hover,.menu button:hover{border-color:#ffc772}.back{margin-top:5px}.notes{font-size:13px;color:var(--muted);line-height:1.55}.codex{text-align:left;display:grid;gap:10px}.codex summary{cursor:pointer;color:var(--gold)}.codex p{margin:8px 0;line-height:1.45}.codex img{height:25px;max-width:45px;object-fit:contain;vertical-align:middle;image-rendering:pixelated;margin-right:7px}
#touch{position:absolute;inset:0;pointer-events:none;z-index:3;display:none}#pad{position:absolute;left:max(19px,env(safe-area-inset-left));bottom:max(19px,env(safe-area-inset-bottom));width:102px;height:102px;border:1px solid #eabf7c69;border-radius:50%;background:#170e1970;pointer-events:auto;touch-action:none;display:grid;place-items:center}#nub{pointer-events:none;width:37px;height:37px;border:1px solid #fed391;border-radius:50%;background:#a16945bb}.actions{position:absolute;right:max(15px,env(safe-area-inset-right));bottom:max(17px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:7px}.actions button{width:58px;height:53px;border:1px solid #d99d5d;border-radius:13px;background:#261a25c9;font-size:10px;font-weight:800;pointer-events:auto;touch-action:none}.actions img{display:block;margin:0 auto 1px;width:20px;height:20px;object-fit:contain;image-rendering:pixelated}.actions .main{height:65px;width:65px;background:#735035dc}.actions button:active{background:#ac6941}
@media(pointer:coarse){#touch{display:block}}@media(max-aspect-ratio:1/1){#touch{display:block}#announce{top:23%}}
</style></head><body><main id="app">
<canvas id="scene" aria-label="Arena de BRASA"></canvas>
<div id="hud" hidden><div><div class="meter" role="meter" aria-label="Chama" aria-valuemin="0" aria-valuemax="100"><div id="flame"></div></div><div id="stats"></div></div><div id="place"></div><button class="pause" id="pause" aria-label="Pausar">Ⅱ</button></div>
<div id="announce" role="status"></div>
<div id="touch" hidden><div id="pad" aria-label="Joystick"><div id="nub"></div></div><div class="actions"><button id="dash">Esquiva</button><button id="skill">Dom</button><button class="main" id="fire">Atacar</button></div></div>
<div id="panel"></div>
</main>

function aim(e){const b=canvas.getBoundingClientRect();input.aim={x:((e.clientX-b.left)*canvas.width/b.width-view.x)*W/view.w,y:((e.clientY-b.top)*canvas.height/b.height-view.y)*H/view.h}}
canvas.onpointerdown=e=>{if(mode==='play'&&e.pointerType==='mouse'){canvas.setPointerCapture(e.pointerId);input.mouse=true;aim(e)}};
canvas.onpointermove=e=>{if(e.pointerType==='mouse')aim(e)};
canvas.onpointerup=canvas.onpointercancel=canvas.onlostpointercapture=()=>input.mouse=false;
addEventListener('keydown',e=>{
 const key=e.key.toLowerCase();
 if(key==='escape'){if(mode==='pause')resumePlay();else pause();return}
 if(mode!=='play')return;
 if(['w','a','s','d',' ','arrowup','arrowdown','arrowleft','arrowright','q','shift'].includes(key))e.preventDefault();
 input.keys.add(key);if(e.repeat)return;
 if(key==='shift')input.dash=true;if(key==='q')input.skill=true;
});
addEventListener('keyup',e=>input.keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>{clearInput();pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();pause()}});
$('pause').onclick=pause;
addEventListener('resize',resize);
let previous=0;
function frame(now){
 const dt=Math.min(.033,(now-(previous||now))/1000);previous=now;globalTime+=dt;
 if(notice>0){notice-=dt;if(notice<=0)$('announce').textContent=''}
 if(mode==='play'){
  tick(dt);score(dt);shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);
  updateHud+=dt;if(updateHud>.12&&mode==='play'){hud();updateHud=0}
 }
 for(const p of fx){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=dt*21}
 fx=fx.filter(p=>p.life>0);
 render();requestAnimationFrame(frame);
}
resize();home();
Promise.all(Object.values(images).map(img=>img.decode().catch(()=>{}))).then(()=>{
 if(!run){biome=BIOMES[0];prepareFloor(biome,seeded(25))}
 requestAnimationFrame(frame);
});


</script>
</body></html>
