const scene=new T.Scene();scene.background=new T.Color(0xb9c9cd);scene.fog=new T.FogExp2(0xb9c9cd,.012);const cam=new T.PerspectiveCamera(72,innerWidth/innerHeight,.08,180);cam.rotation.order='YXZ';const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.prepend(r.domElement);scene.add(new T.HemisphereLight(0xe5efff,0x8c7455,2));const sun=new T.DirectionalLight(0xffe1ad,2.1);sun.position.set(-20,40,15);scene.add(sun);let seed=42;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function tex(base,brick=false){let c=document.createElement('canvas');c.width=c.height=256;let g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,256,256);for(let i=0;i<18000;i++){g.fillStyle=rand()<.5?'#0000000b':'#ffffff13';g.fillRect(rand()*256,rand()*256,2+rand()*4,2+rand()*4)}if(brick){g.strokeStyle='#51463233';for(let y=0;y<256;y+=32){g.beginPath();g.moveTo(0,y);g.lineTo(256,y);g.stroke();for(let x=(y/32%2)*32;x<256;x+=64){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+32);g.stroke()}}}let t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.wrapS=t.wrapT=T.RepeatWrapping;return t}let ground=tex('#a99570');ground.repeat.set(32,32);let wall=tex('#b5a58a',true),roof=tex('#777369'),dark= new T.MeshStandardMaterial({color:0x33352e});let solids=[];function box(x,y,z,w,h,d,map,solid=false){let m=new T.Mesh(new T.BoxGeometry(w,h,d),map?.isMaterial?map:new T.MeshStandardMaterial({map}));m.position.set(x,y,z);scene.add(m);if(solid)solids.push([x-w/2,x+w/2,z-d/2,z+d/2]);return m}box(0,-.15,0,160,.3,160,ground);function house(x,z,w,d,h){box(x,h/2,z,w,h,d,wall,true);box(x,h+.15,z,w+.5,.3,d+.5,roof);for(let i=-1;i<=1;i++){box(x+i*w/3,h*.65,z+d/2+.025,w*.17,h*.25,.05,dark);box(x+i*w/3,h*.49,z+d/2+.09,w*.2,.12,.18,roof)}box(x,.95,z+d/2+.04,1.1,1.9,.08,dark);box(x,h+.45,z-d/2,w,.6,.2,wall)}house(-9,-10,8,7,4);house(9,-16,9,8,5);house(-13,8,7,8,3.5);house(13,9,10,7,4);house(0,-29,12,7,4);let road=tex('#817d70');road.repeat.set(2,18);box(0,.015,0,6,.03,65,road);for(let i=0;i<45;i++){let x=(rand()-.5)*85,z=(rand()-.5)*85;if(Math.abs(x)<18&&Math.abs(z)<32)continue;let trunk=new T.MeshStandardMaterial({color:0x756047});box(x,1.7,z,.3,3.4,.3,trunk);let tree=new T.Mesh(new T.IcosahedronGeometry(1.8,1),new T.MeshStandardMaterial({color:0x747e4b,flatShading:true}));tree.position.set(x,3.5,z);scene.add(tree)}for(let i=0;i<22;i++){let x=(rand()-.5)*130,z=(rand()-.5)*130;if(Math.abs(x)<25&&Math.abs(z)<35)continue;let hill=new T.Mesh(new T.ConeGeometry(9+rand()*10,5+rand()*8,7),new T.MeshStandardMaterial({color:0xa79a7c,flatShading:true}));hill.position.set(x,0,z);scene.add(hill)}cam.position.set(0,1.7,18);let yaw=0,pitch=0,mx=0,my=0,run=false,duck=false,look=null;const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');function move(e){let b=stick.getBoundingClientRect(),x=e.clientX-b.left-60,y=e.clientY-b.top-60,l=Math.max(1,Math.hypot(x,y)/43);mx=x/l/43;my=y/l/43;knob.style.transform=`translate(${mx*43}px,${my*43}px)`}stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);move(e)};stick.onpointermove=e=>{if(stick.hasPointerCapture(e.pointerId))move(e)};stick.onpointerup=stick.onpointercancel=()=>{mx=my=0;knob.style.transform=''};r.domElement.onpointerdown=e=>{look=[e.clientX,e.clientY];r.domElement.setPointerCapture(e.pointerId)};r.domElement.onpointermove=e=>{if(!look)return;yaw-=(e.clientX-look[0])*.004;pitch=Math.max(-1.3,Math.min(1.3,pitch-(e.clientY-look[1])*.004));look=[e.clientX,e.clientY]};r.domElement.onpointerup=r.domElement.onpointercancel=()=>look=null;const runBtn=document.querySelector('#run'),duckBtn=document.querySelector('#duck');function sync(){for(const [el,on] of [[runBtn,run],[duckBtn,duck]]){el.style.background=on?'#756b45':'#2229';el.setAttribute('aria-pressed',String(on))}duckBtn.textContent=duck?'LEVANTAR':'AGACHAR'}function bind(el,fn){el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation( const dummy=new T.Group();dummy.position.set(0,0,10);scene.add(dummy);const orange=new T.MeshStandardMaterial({color:0xe3a03a}),blue=new T.MeshStandardMaterial({color:0x40566b});const joints=[],parts=[];function joint(parent,x,y,z){const j=new T.Group();j.position.set(x,y,z);parent.add(j);joints.push(j);return j}function dummyPart(parent,g,m,x,y,z,label){const o=new T.Mesh(g,m.clone());o.position.set(x,y,z);parent.add(o);o.userData={label,joint:parent,base:m.color.clone()};parts.push(o);return o}const hip=joint(dummy,0,.92,0),body=joint(hip,0,.12,0);dummyPart(body,new T.BoxGeometry(.48,.52,.28),orange,0,.25,0,'Tronco');const neck=joint(body,0,.56,0);dummyPart(neck,new T.SphereGeometry(.18,16,12),orange,0,.16,0,'Cabeça');for(const side of [-1,1]){const arm=joint(body,side*.32,.44,0);dummyPart(arm,new T.CapsuleGeometry(.085,.23,4,8),blue,0,-.14,0,'Braço');const elbow=joint(arm,0,-.31,0);dummyPart(elbow,new T.CapsuleGeometry(.075,.22,4,8),blue,0,-.14,0,'Antebraço');const leg=joint(hip,side*.14,0,0);dummyPart(leg,new T.CapsuleGeometry(.10,.26,4,8),blue,0,-.19,0,'Perna');const knee=joint(leg,0,-.43,0);dummyPart(knee,new T.CapsuleGeometry(.085,.24,4,8),blue,0,-.18,0,'Perna');}let points=0,hits=0,pulse=0,fall=0,flash=0,active=null;const score=document.querySelector('#score');function restore(){hits=0;fall=0;active=null;dummy.rotation.set(0,0,0);dummy.position.y=0;for(const j of joints)j.rotation.set(0,0,0);for(const p of parts)p.material.color.copy(p.userData.base);score.textContent='Pontos: '+points}bind(document.querySelector('#reset'),restore);const ray=new T.Raycaster();function fire(){if(pulse>.07)return;pulse=.20;flash=.10;scene.updateMatrixWorld(true);ray.setFromCamera(new T.Vector2(0,0),cam);const result=ray.intersectObjects(parts,false)[0];if(hits<1&&result){hits++;points+=10;active=result.object.userData.joint;result.object.material.color.set(0xffffff);score.textContent='Pontos: '+points+' • '+result.object.userData.label+(hits===1?' • Alvo derrubado':'');}try{const ac=fire.ac||(fire.ac=new (window.AudioContext||window.webkitAudioContext)());ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(180,ac.currentTime);o.frequency.exponentialRampToValueAtTime(65,ac.currentTime+.09);g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.1);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.11)}catch(e){}}bind(document.querySelector('#fire'),fire);
let keys={};window.onkeydown=e=>keys[e.key.toLowerCase()]=true;window.onkeyup=e=>keys[e.key.toLowerCase()]=false;function free(x,z){return Math.abs(x)<65&&Math.abs(z)<65&&!solids.some(a=>x>a[0]-.35&&x<a[1]+.35&&z>a[2]-.35&&z<a[3]+.35)}let clock=new T.Clock(),phase=0;function frame(){requestAnimationFrame(frame);let dt=Math.min(.05,clock.getDelta()),a=mx+(keys.d?1:0)-(keys.a?1:0),b=my+(keys.s?1:0)-(keys.w?1:0),len=Math.max(1,Math.hypot(a,b)),s=(duck?1.4:run?5:2.8)*dt/len;let dx=(a*Math.cos(yaw)+b*Math.sin(yaw))*s,dz=(-a*Math.sin(yaw)+b*Math.cos(yaw))*s;if(free(cam.position.x+dx,cam.position.z))cam.position.x+=dx;if(free(cam.position.x,cam.position.z+dz))cam.position.z+=dz;phase+=Math.hypot(a,b)*dt*8;let height=(duck?1.05:1.7)+(Math.hypot(a,b)>.1?Math.sin(phase)*.025:0);cam.position.y+=(height-cam.position.y)*Math.min(1,dt*12);view.position.y+=((-.29+(run&&!duck&&Math.hypot(a,b)>.1?-.07:0)+Math.sin(phase)*.009*Math.min(1,Math.hypot(a,b)))-view.position.y)*Math.min(1,dt*10);cam.rotation.set(pitch,yaw,0);pulse=Math.max(0,pulse-dt);flash=Math.max(0,flash-dt);view.position.z=-.48+Math.sin(pulse/.20*Math.PI)*.07;document.querySelector("#flash").style.opacity=flash*2;if(hits===1){fall=Math.min(1,fall+dt*1.7);const ease=fall*fall*(3-2*fall);dummy.rotation.x=-ease*Math.PI/2;for(let i=0;i<joints.length;i++){joints[i].rotation.z=Math.sin(i*2.1)*ease*.22;joints[i].rotation.x=Math.sin(i*1.7)*ease*.28;}}else{for(const j of joints){j.rotation.x+=(0-j.rotation.x)*Math.min(1,dt*10);}if(active)active.rotation.x=Math.sin(pulse/.20*Math.PI)*.24;}for(const p of parts)p.material.color.lerp(p.userData.base,Math.min(1,dt*6));r.render(scene,cam)}frame();window.onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};
