<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Jelly — Street Lab</title><style>*{box-sizing:border-box;touch-action:none}body{margin:0;background:#161719;color:white;font:14px system-ui;overflow:hidden}canvas{width:100vw;height:100dvh;display:block;image-rendering:pixelated}#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;pointer-events:none;text-shadow:0 2px 4px black}#controls{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:16px;right:16px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}button{pointer-events:auto;background:#20252bd9;color:white;border:1px solid #ffffff55;border-radius:12px;min-width:54px;height:54px;font:bold 22px system-ui;user-select:none}#pad{display:grid;grid-template-columns:repeat(3,54px);gap:3px}#pad button:first-child{grid-column:2}#pad button:nth-child(2){grid-column:1}#load{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#15191e;padding:24px}#load[hidden]{display:none}input{touch-action:auto}small{opacity:.75}</style><canvas id="c"></canvas><div id="hud">JELLY / STREET LAB 0.8<br><small id="status">Rua em movimento • 0.8</small></div><div id="load"><h2>Jelly — Street Lab</h2><p>Importe o pacote local de imagens JSON.</p><input id="file" type="file" accept=".json,application/json"></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),status=document.querySelector('#status'),load=document.querySelector('#load');let art=null,p={x:300,y:285,vx:0,vy:0,face:1,dir:'side',phase:0},keys=new Set(),target=null,cam=0,last=0,scale=1,ox=0,oy=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));async function boot(data){const img=src=>new Promise((ok,no)=>{let i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=src});let a={street:await img(data.street)};for(const k of ['walk','front','back','run','idle'])a[k]=await Promise.all(data[k].map(img));art=a;load.hidden=true}document.querySelector('#file').onchange=async e=>{try{await boot(JSON.parse(await e.target.files[0].text()))}catch(e){alert('Pacote inválido')}};let cameraReady=false;let lastTap=null;onblur=()=>{lastTap=null};c.onpointerdown=e=>{if(!art||!e.isPrimary||e.button!==0)return;e.preventDefault();const x=clamp((e.clientX-ox)/scale+cam,18,865),y=clamp((e.clientY-oy)/scale,267,307),now=performance.now();const run=!!lastTap&&now-lastTap.t<=350&&Math.hypot(e.clientX-lastTap.sx,e.clientY-lastTap.sy)<=32;target={x,y,run};lastTap=run?null:{t:now,sx:e.clientX,sy:e.clientY}};const npc={x:450,y:285,vx:0,vy:0,face:1,dir:'side',phase:0,goal:845};function moveJelly(p,dx,dy,run,dt){let n=Math.hypot(dx,dy);if(n){dx/=n;dy/=n}let speed=run?115:55,f=1-Math.exp(-dt*16);p.vx+=(dx*speed-p.vx)*f;p.vy+=(dy*speed*.55-p.vy)*f;p.x=clamp(p.x+p.vx*dt,18,865);p.y=clamp(p.y+p.vy*dt,267,307);let moving=Math.hypot(p.vx,p.vy)>4;if(n){if(Math.abs(dx)>.55){p.dir='side';p.face=dx>0?1:-1}else p.dir=dy>0?'front':'back'}let mode=moving?(p.dir==='side'?(run?'run':'walk'):p.dir):'idle';p.phase+=dt*(moving?(run?13:9):2);return art[mode][Math.floor(p.phase)%art[mode].length];}function drawJelly(p,im){g.fillStyle='#0005';g.beginPath();g.ellipse(Math.round(p.x),Math.round(p.y),7,2,0,0,Math.PI*2);g.fill();g.save();g.translate(Math.round(p.x),Math.round(p.y));if(p.dir==='side'&&p.face<0)g.scale(-1,1);g.drawImage(im,-Math.floor(im.width/2),-im.height);g.restore();}function frame(t){requestAnimationFrame(frame);let dt=Math.min(.04,(t-last)/1000||0);last=t;if(!art)return;let w=innerWidth,h=innerHeight,dpr=devicePixelRatio||1;if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}g.setTransform(dpr,0,0,dpr,0,0);g.imageSmoothingEnabled=false;scale=Math.max(h/360,w/440);let vw=w/scale;ox=0;oy=h-360*scale;let dx=0,dy=0,run=false;if(target){dx=target.x-p.x;dy=(target.y-p.y)/.55;run=target.run;const dist=Math.hypot(dx,dy);if(dist<=Math.max(2,(run?115:55)*dt+1)){p.x=target.x;p.y=target.y;p.vx=0;p.vy=0;target=null;dx=dy=0;run=false}}let im=moveJelly(p,dx,dy,run,dt),moving=Math.hypot(p.vx,p.vy)>4;let want=clamp(p.x-vw*.5,0,Math.max(0,883-vw));if(!cameraReady){cam=want;cameraReady=true}else{cam=clamp(cam+(want-cam)*(1-Math.exp(-dt*14)),0,Math.max(0,883-vw));}g.fillStyle='#161719';g.fillRect(0,0,w,h);g.save();g.translate(ox-cam*scale,oy);g.scale(scale,scale);g.drawImage(art.street,0,0,883,360);if(Math.abs(npc.goal-npc.x)<2)npc.goal=npc.goal===845?38:845;const npcIm=moveJelly(npc,npc.goal-npc.x,0,false,dt);if(npc.y<=p.y){drawJelly(npc,npcIm);drawJelly(p,im)}else{drawJelly(p,im);drawJelly(npc,npcIm)}g.restore();status.textContent=(moving?(run?'Correndo':'Caminhando'):'Parado')+' · '+Math.round(p.x)+' mapeado';}requestAnimationFrame(frame);
</script></html>
